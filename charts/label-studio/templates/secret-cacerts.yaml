{{- /*
  Same as library-chart.secretCacerts, but the CA bundle URL is quoted: in the
  library-chart version this chart uses (1.5.x) it is not, so a value such as
  "https://...\n---\n<manifest>" would inject an extra Kubernetes document.
*/ -}}
{{- if (.Values.certificates).cacerts }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library-chart.secretNameCacerts" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if regexMatch "^https?://" .Values.certificates.cacerts }}
  ca-certs.url: {{ .Values.certificates.cacerts | quote }}
  {{- else }}
  ca.pem: |
    {{- .Values.certificates.cacerts | nindent 4 }}
  {{- end }}
{{- end }}

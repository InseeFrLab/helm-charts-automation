{{- $fullName := include "library-chart.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "library-chart.fullname" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
{{- end }}
  selector:
    matchLabels:
      {{- include "library-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if (.Values.certificates).cacerts }}
        checksum/cacerts: {{ .Values.certificates.cacerts | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "library-chart.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if (.Values.certificates).cacerts }}
      volumes:
        - name: cacerts
          secret:
            secretName: {{ include "library-chart.secretNameCacerts" . }}
        - name: ca-bundle
          emptyDir: {}
      initContainers:
        # Append the custom CAs to the default certifi bundle
        - name: build-ca-bundle
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.service.image.repository }}:{{ .Values.service.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.service.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import os, urllib.request, certifi
              if os.path.exists("/cacerts/ca-certs.url"):
                  url = open("/cacerts/ca-certs.url").read().strip()
                  custom = urllib.request.urlopen(url).read().decode()
              else:
                  custom = open("/cacerts/ca.pem").read()
              with open("/ca-bundle/ca-bundle.crt", "w") as f:
                  f.write(open(certifi.where()).read() + "\n" + custom + "\n")
          volumeMounts:
            - name: cacerts
              mountPath: /cacerts
            - name: ca-bundle
              mountPath: /ca-bundle
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.service.image.repository }}:{{ .Values.service.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.service.image.pullPolicy | quote }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /label-studio/data
            {{- end }}
            {{- if (.Values.certificates).cacerts }}
            - name: ca-bundle
              mountPath: /ca-bundle
              readOnly: true
            {{- end }}
          envFrom:
            {{- if .Values.s3.enabled }}
            - secretRef:
                name: {{ include "library-chart.secretNameS3" . }}
            {{- end }}
          env:
            - name: LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK
              value: "true"
            - name: LABEL_STUDIO_USERNAME
              value: {{ .Values.security.username | quote }}
            - name: LABEL_STUDIO_PASSWORD
              value: {{ .Values.security.password | quote }}
            {{- if .Values.s3.enabled }}
            - name: AWS_ENDPOINT_URL
              value: {{ printf "https://%s" .Values.s3.endpoint | quote }}
            {{- if .Values.s3.defaultRegion }}
            # Label Studio reads S3_region, not AWS_DEFAULT_REGION
            - name: S3_region
              value: {{ .Values.s3.defaultRegion | quote }}
            {{- end }}
            # Show detailed S3 errors for the endpoint domain
            - name: S3_TRUSTED_STORAGE_DOMAINS
              value: {{ .Values.s3.endpoint | regexFind "[^.]+\\.[^.:/]+(:[0-9]+)?/?$" | regexFind "^[^:/]+" | quote }}
            {{- end }}
            {{- if (.Values.certificates).cacerts }}
            - name: REQUESTS_CA_BUNDLE
              value: /ca-bundle/ca-bundle.crt
            - name: AWS_CA_BUNDLE
              value: /ca-bundle/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /ca-bundle/ca-bundle.crt
            {{- end }}
            - name: CSRF_TRUSTED_ORIGINS
              value: {{ printf "%v://%v" (ternary "https" "http" (not (empty .Values.ingress.tls))) .Values.ingress.hostname | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["{{ .Values.persistence.accessMode }}"]
      {{- if .Values.persistence.storageClass }}
      {{- if (eq "-" .Values.persistence.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: {{ .Values.persistence.storageClass | quote }}
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
  {{- end }}

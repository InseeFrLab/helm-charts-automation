apiVersion: v1
kind: Service
metadata:
  name: {{ include "yatai.fullname" . }}
  labels:
    {{- include "yatai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | quote }}
  ports:
    - port: {{ .Values.service.port | int }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort | int }}
      protocol: TCP
      name: http
  selector:
    {{- include "yatai.selectorLabels" . | nindent 4 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "metaflow-ui.fullname" . }}
  labels:
    {{- include "metaflow-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.networking.serviceBackend.type | quote }}
  ports:
    - port: {{ .Values.networking.serviceBackend.port | int }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "metaflow-ui.selectorLabels" . | nindent 4 }}
